<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라디오 서천 신청곡</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d6336c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="라디오 서천">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 따뜻하고 단순하게, 어르신이 한눈에 읽는 마을 방송국 게시판
   IDEA: 마을회관 벽에 붙은 큰 글씨 신청곡 접수 장부
   PICTURE: 게시판 목록 자체가 그림 — 큰 줄, 큰 버튼
   COLOUR and TYPE: 흰 바탕, 짙은 먹색 글씨, 진분홍 한 가지 강조색 / Noto Sans KR
   LAYOUT: 한 줄 기둥, 최대 1100px, 휴대폰에선 줄을 카드처럼 쌓음 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#16171a);--ink:light-dark(#1b1b1f,#f2f2f4);--sub:light-dark(#555a63,#b7bbc3);--line:light-dark(#dcdfe4,#34363c);--soft:light-dark(#f6f6f8,#202227);--ac:light-dark(#d6336c,#ff6b9a);--acink:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,14px) 60px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{margin:0;font-size:clamp(32px,6vw,46px);line-height:1.1;font-weight:800;display:flex;align-items:center;gap:14px}
h1 svg{flex:none}
.tag{margin:6px 0 0;color:var(--sub);font-size:19px}
button,.btn{font:inherit;font-size:22px;font-weight:700;min-height:60px;padding:0 26px;border-radius:12px;border:2px solid var(--ac);background:var(--ac);color:var(--acink);cursor:pointer}
button.ghost{background:transparent;color:var(--ac)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid light-dark(#ffb3cb,#80304a);outline-offset:2px}
table{width:100%;border-collapse:collapse;border-top:3px solid var(--ink)}
th{font-weight:800;padding:18px 10px;border-bottom:1px solid var(--line);font-size:21px}
td{padding:20px 10px;border-bottom:1px solid var(--line);text-align:center;color:var(--sub)}
td.t{text-align:left;color:var(--ink);font-weight:600}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--soft)}
tr.notice{background:var(--soft)}
.badge{display:inline-block;border:2px solid var(--ac);color:var(--ac);padding:2px 12px;border-radius:6px;font-size:18px;font-weight:700}
.vill{color:var(--ac);font-weight:700}
.num{width:90px}.c-v{width:150px}.c-n{width:140px}.c-d{width:130px;white-space:nowrap}
.pager{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:30px 0}
.pager button{min-width:56px;padding:0 12px;background:transparent;color:var(--ink);border-color:transparent}
.pager button.on{border-color:var(--ac);color:var(--ac)}
.search{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
input,textarea{font:inherit;font-size:22px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px 16px;width:100%}
.search input{flex:1 1 260px;max-width:440px;min-height:60px}
.empty{padding:50px 10px;text-align:center;color:var(--sub)}
.form{max-width:760px;margin:0 auto;display:grid;gap:26px}
label{display:block;font-weight:800;font-size:24px;margin-bottom:8px}
.hint{display:block;font-weight:400;font-size:18px;color:var(--sub);margin-top:2px}
textarea{min-height:300px;line-height:1.6;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.acts button{flex:1 1 200px;max-width:320px}
.err{color:var(--ac);font-weight:700;text-align:center;min-height:1.6em;margin:0}
.read{max-width:820px;margin:0 auto}
.read .meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:21px;color:var(--sub);padding:16px 0;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.read .meta b{color:var(--ink)}
.read .body{white-space:pre-wrap;font-size:26px;line-height:1.75;padding:30px 4px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.note{font-size:16px;color:var(--sub);text-align:center;margin-top:26px}
.pick{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.pick label.btn{display:inline-flex;align-items:center;justify-content:center;margin:0;font-size:22px;color:var(--ac);background:transparent}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.thumbs{display:flex;flex-wrap:wrap;gap:12px}
.thumb{position:relative;width:120px;height:120px;border-radius:12px;overflow:hidden;background:var(--soft);border:2px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;min-height:40px;width:40px;padding:0;border-radius:50%;font-size:22px;line-height:1;background:rgba(0,0,0,.65);border:0;color:#fff}
.pcount{font-size:18px;color:var(--sub);margin:8px 0 0}
.ptag{display:inline-block;margin-left:8px;padding:0 8px;border-radius:6px;background:var(--soft);color:var(--ac);font-size:16px;font-weight:700;vertical-align:2px;white-space:nowrap}
.photos{display:grid;gap:16px;padding:24px 0 6px}
.photos a{display:block;border-radius:12px;overflow:hidden;background:var(--soft)}
.photos img{width:100%;height:auto;display:block}
.pin{max-width:220px;letter-spacing:.3em;font-size:26px}
.delbox{margin-top:20px;padding:20px;border:2px solid var(--line);border-radius:14px;display:grid;gap:12px;max-width:520px;margin-inline:auto}
.delbox p{margin:0;font-size:19px}
.delrow{display:flex;flex-wrap:wrap;gap:10px}
.delrow input{flex:1 1 160px;max-width:240px}
.htag{display:inline-block;margin-left:8px;padding:0 8px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:700;vertical-align:2px;white-space:nowrap}
tr.hid td{opacity:.55}
.abar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700}
.abar button{min-height:48px;font-size:18px;background:var(--bg);color:var(--ink);border-color:var(--bg)}
.alink{background:none;border:0;min-height:44px;padding:0 10px;font-size:16px;font-weight:400;color:var(--sub);text-decoration:underline}
.hidnote{margin:14px 0 0;padding:12px 16px;border-radius:10px;background:var(--soft);font-size:18px;font-weight:700}
.inst{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px 14px;margin:0 0 18px;padding:14px 16px;border-radius:14px;background:light-dark(#fde8ef,#3a1f29);border:2px solid var(--ac);font-weight:700;font-size:19px}
.inst img{width:48px;height:48px;border-radius:12px;flex:none}
.inst span{font-weight:600;line-height:1.45}
.inst span b{color:var(--ac)}
.inst #instBtn{grid-column:1/-1;min-height:52px;font-size:20px}
.inst .x{min-width:52px;padding:0;background:transparent;border:0;color:var(--sub);font-size:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:90vw;text-align:center;background:var(--ink);color:var(--bg);padding:16px 26px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:700px){
 body{font-size:19px}
 thead{display:none}
 table,tbody{display:block}
 tbody tr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:16px 6px;border-bottom:1px solid var(--line)}
 td{border:0;padding:0;text-align:left;width:auto!important}
 td.num{grid-column:1;grid-row:1/span 4;min-width:2.2em;text-align:center;font-size:22px;font-weight:800;color:var(--ac);align-self:start;padding-top:2px}
 td.c-v,td.t,td.c-n,td.c-d{grid-column:2}
 td.t{font-size:22px}
 td.c-d{font-size:17px}
 td.empty{grid-column:1/-1}
 .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div>
   <h1><svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><rect x="4" y="16" width="44" height="30" rx="7" fill="var(--ac)"/><line x1="14" y1="16" x2="38" y2="5" stroke="var(--ac)" stroke-width="3" stroke-linecap="round"/><circle cx="17" cy="31" r="8" fill="none" stroke="#fff" stroke-width="3"/><rect x="30" y="24" width="12" height="4" rx="2" fill="#fff"/><rect x="30" y="33" width="12" height="4" rx="2" fill="#fff"/></svg>라디오 서천 신청곡</h1>
   <p class="tag">사연과 듣고 싶은 노래를 보내 주세요</p>
  </div>
  <button id="goWrite">✎ 글쓰기</button>
 </header>

 <div class="inst" id="inst" hidden><img src="icon-192.png" alt=""><span id="instTxt">휴대폰 홈 화면에 '라디오 서천' 앱을 놓아 두면 다음부터 바로 열려요</span><button id="instBtn">앱 설치</button><button class="x" id="instX" aria-label="안내 닫기">×</button></div>
 <section id="vList">
  <div class="abar" id="aBar" hidden><span>관리자 모드 — 비공개 글도 보입니다</span><button id="aOut">관리자 나가기</button></div>
  <div class="delbox" id="aBox" hidden style="margin:0 auto 20px">
   <p><b>관리자 비밀번호</b>를 적어 주세요.</p>
   <div class="delrow"><input id="aPin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="관리자 비밀번호"><button id="aGo">들어가기</button></div>
   <p class="err" id="aErr" role="alert" style="text-align:left"></p>
  </div>
  <table>
   <thead><tr><th class="num">번호</th><th class="c-v">마을</th><th>사연 · 신청곡</th><th class="c-n">이름</th><th class="c-d">날짜</th></tr></thead>
   <tbody id="rows"></tbody>
  </table>
  <div class="pager" id="pager"></div>
  <form class="search" id="sForm">
   <input id="sInput" type="search" placeholder="마을, 이름, 노래 찾기" aria-label="검색어">
   <button type="submit">검색</button>
  </form>
 </section>

 <section id="vWrite" hidden>
  <form class="form" id="wForm" novalidate>
   <div class="two">
    <div><label for="fVill">마을 이름</label><input id="fVill" list="villList" maxlength="30" placeholder="예) 시초면 신곡리" autocomplete="off"></div>
    <div><label for="fName">보내는 사람</label><input id="fName" maxlength="20" placeholder="예) 김순자"></div>
   </div>
   <datalist id="villList"><option>서천읍</option><option>장항읍</option><option>마서면</option><option>화양면</option><option>한산면</option><option>마산면</option><option>시초면</option><option>문산면</option><option>판교면</option><option>기산면</option><option>비인면</option><option>서면</option><option>종천면</option></datalist>
   <div>
    <label for="fBody">사연과 신청곡<span class="hint">하고 싶은 이야기와 듣고 싶은 노래를 함께 적어 주세요</span></label>
    <textarea id="fBody" maxlength="3000" placeholder="예) 오늘 손주가 다녀갔어요. 너무 반가웠습니다.&#10;&#10;신청곡: 나훈아 - 고향역"></textarea>
   </div>
   <div>
    <span style="display:block;font-weight:800;font-size:24px;margin-bottom:8px">사진 <span class="hint" style="display:inline;margin:0">(넣고 싶을 때만, 3장까지)</span></span>
    <div class="pick">
     <label class="btn" for="fPhoto" id="pickBtn">사진 넣기</label>
     <input id="fPhoto" type="file" accept="image/*" multiple>
     <div class="thumbs" id="thumbs"></div>
    </div>
    <p class="pcount" id="pCount"></p>
   </div>
   <div>
    <label for="fPin">글 비밀번호<span class="hint">숫자 4자리 — 나중에 이 글을 지울 때 필요해요</span></label>
    <input id="fPin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
   </div>
   <p class="err" id="wErr" role="alert"></p>
   <div class="acts"><button type="button" class="ghost" id="wCancel">취소</button><button type="submit" id="wSubmit">올리기</button></div>
  </form>
 </section>

 <section id="vRead" hidden>
  <div class="read">
   <div class="meta" id="rMeta"></div>
   <p class="hidnote" id="rHidNote" hidden>비공개 글입니다 — 관리자만 볼 수 있어요</p>
   <div class="body" id="rBody"></div>
   <div class="photos" id="rPhotos"></div>
   <div class="acts" style="margin-top:26px"><button class="ghost" id="rBack">목록으로</button><button class="ghost" id="rDel">이 글 지우기</button><button class="ghost" id="rHide" hidden>비공개로 돌리기</button></div>
   <div class="delbox" id="delBox" hidden>
    <p>글 쓸 때 정한 <b>비밀번호 4자리</b>를 적어 주세요.<br><span style="color:var(--sub);font-size:17px">관리자는 관리자 비밀번호를 적으면 됩니다.</span></p>
    <div class="delrow"><input id="dPin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="비밀번호"><button id="dGo">지우기</button></div>
    <p class="err" id="dErr" role="alert" style="text-align:left"></p>
   </div>
  </div>
 </section>

 <p class="note"><button class="alink" id="aLink">관리자</button></p>
 <p class="note" id="status">게시판을 불러오는 중입니다…</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const $=id=>document.getElementById(id);
const PER=10;
let posts=[],page=1,q='',busy=false,cur=null,adminPin='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{const d=new Date(t);return isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const title=b=>{const l=String(b||'').split('\n').map(x=>x.trim()).filter(Boolean);return l[0]||'(내용 없음)'};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)};
// ▼▼▼ 구글 Apps Script 배포 주소(…/exec)를 따옴표 안에 붙여넣으세요 ▼▼▼
const API_URL='https://script.google.com/macros/s/AKfycbysjD_Z4kzHvsJsiAqCBI2aA330Yk34ON9yschnQF77t6L_bqd6G2meBmhp3i66yKjViA/exec';
// ▲▲▲
async function server(fn,arg){
 const r=fn==='listPosts'
  ?await fetch(API_URL+'?action=list&t='+Date.now())
  :await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(arg)});
 if(!r.ok)throw new Error('network');
 const j=await r.json();
 if(!j.ok)throw new Error(j.error||'server');
 return j.posts;
}

function show(v){for(const k of ['vList','vWrite','vRead'])$(k).hidden=k!==v;$('goWrite').hidden=v!=='vList';window.scrollTo(0,0)}
function filtered(){if(!q)return posts;const w=q.toLowerCase();return posts.filter(p=>[p.village,p.name,p.body].join(' ').toLowerCase().includes(w))}

function render(){
 const list=filtered(),pages=Math.max(1,Math.ceil(list.length/PER));
 if(page>pages)page=pages;
 const start=(page-1)*PER,slice=list.slice(start,start+PER);
 let h=`<tr class="notice"><td class="num"><span class="badge">안내</span></td><td class="t" colspan="4">글쓰기를 누르고 마을 · 이름 · 사연과 신청곡을 적어 주세요</td></tr>`;
 if(!slice.length)h+=`<tr><td colspan="5" class="empty">${q?'찾는 글이 없습니다':'아직 올라온 신청곡이 없습니다. 첫 사연을 보내 주세요!'}</td></tr>`;
 h+=slice.map((p,i)=>`<tr class="row${p.hidden?' hid':''}" data-id="${esc(p.id)}" tabindex="0"><td class="num">${list.length-start-i}</td><td class="c-v vill">${esc(p.village)}</td><td class="t">${esc(title(p.body))}${p.photos&&p.photos.length?`<span class="ptag">사진 ${p.photos.length}</span>`:''}${p.hidden?'<span class="htag">비공개</span>':''}</td><td class="c-n">${esc(p.name)}</td><td class="c-d">${fmt(p.at)}</td></tr>`).join('');
 $('rows').innerHTML=h;
 let g='';
 if(pages>1){for(let n=1;n<=pages;n++)g+=`<button class="${n===page?'on':''}" data-p="${n}" aria-label="${n}쪽">${n}</button>`}
 $('pager').innerHTML=g;
}

function openPost(id){
 const p=posts.find(x=>x.id===id);if(!p)return;cur=p;$('delBox').hidden=true;$('dPin').value=adminPin;$('dErr').textContent='';
 $('rHide').hidden=!adminPin;$('rHide').textContent=p.hidden?'다시 공개하기':'비공개로 돌리기';$('rHidNote').hidden=!p.hidden;
 $('rMeta').innerHTML=`<span>마을 <b>${esc(p.village)}</b></span><span>보낸 분 <b>${esc(p.name)}</b></span><span>${fmt(p.at)}</span>`;
 $('rBody').textContent=p.body;
 const ph=(p.photos||[]).filter(x=>/^[\w-]+$/.test(x));
 $('rPhotos').innerHTML=ph.map((id,i)=>`<a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener"><img src="https://drive.google.com/thumbnail?id=${id}&sz=w1600" alt="사진 ${i+1}" loading="lazy"></a>`).join('');
 show('vRead');
}

async function load(quiet){
 if(busy)return;busy=true;
 try{posts=adminPin?await server('adminList',{action:'adminList',pin:adminPin}):await server('listPosts');render();$('status').textContent='PC와 휴대폰 어디서 올려도 이 게시판에 함께 모입니다.'}
 catch(e){if(!quiet)$('status').textContent='게시판을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.'}
 finally{busy=false}
}

$('rows').addEventListener('click',e=>{const r=e.target.closest('tr.row');if(r)openPost(r.dataset.id)});
$('rows').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('tr.row');if(r)openPost(r.dataset.id)}});
$('pager').addEventListener('click',e=>{const b=e.target.closest('button');if(b){page=+b.dataset.p;render();window.scrollTo(0,0)}});
$('sForm').addEventListener('submit',e=>{e.preventDefault();q=$('sInput').value.trim();page=1;render()});
$('goWrite').addEventListener('click',()=>{$('wErr').textContent='';show('vWrite');$('fVill').focus()});
$('wCancel').addEventListener('click',()=>show('vList'));
$('rBack').addEventListener('click',()=>show('vList'));

try{$('fVill').value=localStorage.getItem('sr_vill')||'';$('fName').value=localStorage.getItem('sr_name')||''}catch(e){}

// ---- 관리자 모드 (비밀번호는 이 화면을 닫으면 잊어버림)
const errMsg=e=>/WRONG_PIN/.test(e.message)?'비밀번호가 맞지 않아요':/LOCKED/.test(e.message)?'비밀번호가 여러 번 틀려서 10분 동안 막혔어요':'잠시 뒤 다시 눌러 주세요';
$('aLink').addEventListener('click',()=>{if(adminPin)return;show('vList');$('aBox').hidden=false;$('aPin').value='';$('aErr').textContent='';$('aPin').focus();window.scrollTo(0,0)});
$('aGo').addEventListener('click',async()=>{
 const pin=$('aPin').value.trim();if(!pin){$('aErr').textContent='비밀번호를 적어 주세요';return}
 const b=$('aGo');b.disabled=true;
 try{posts=await server('adminList',{action:'adminList',pin});adminPin=pin;$('aBox').hidden=true;$('aBar').hidden=false;page=1;render();toast('관리자 모드입니다')}
 catch(e){$('aErr').textContent=errMsg(e)}
 finally{b.disabled=false}
});
$('aPin').addEventListener('keydown',e=>{if(e.key==='Enter')$('aGo').click()});
$('aOut').addEventListener('click',()=>{adminPin='';$('aBar').hidden=true;posts=posts.filter(p=>!p.hidden);render();load(true);toast('관리자 모드를 나왔습니다')});
$('rHide').addEventListener('click',async()=>{
 if(!cur||!adminPin)return;const b=$('rHide');b.disabled=true;const want=!cur.hidden;
 try{posts=await server('hide',{action:'hide',id:cur.id,pin:adminPin,hidden:want});render();const id=cur.id;openPost(id);toast(want?'비공개로 돌렸습니다':'다시 공개했습니다')}
 catch(e){toast(errMsg(e))}
 finally{b.disabled=false}
});

// ---- 글 지우기
$('rDel').addEventListener('click',()=>{const b=$('delBox');b.hidden=!b.hidden;if(!b.hidden)$('dPin').focus()});
$('dGo').addEventListener('click',async()=>{
 const pin=$('dPin').value.trim();if(!pin||!cur){$('dErr').textContent='비밀번호를 적어 주세요';return}
 const b=$('dGo');b.disabled=true;b.textContent='지우는 중…';
 try{posts=await server('delete',{action:'delete',id:cur.id,pin});render();show('vList');toast('글을 지웠습니다');if(adminPin)load(true)}
 catch(e){$('dErr').textContent=/WRONG_PIN/.test(e.message)?'비밀번호가 맞지 않아요':/LOCKED/.test(e.message)?'비밀번호가 여러 번 틀려서 10분 동안 지울 수 없어요':'지우지 못했습니다. 잠시 뒤 다시 눌러 주세요'}
 finally{b.disabled=false;b.textContent='지우기'}
});
$('dPin').addEventListener('keydown',e=>{if(e.key==='Enter')$('dGo').click()});

// ---- 사진 (최대 3장, 긴 쪽 1280px로 줄여서 보냄)
const MAXP=3;let photos=[];
function shrink(file){return new Promise((ok,no)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',0.82))};im.onerror=()=>{URL.revokeObjectURL(url);no(new Error('img'))};im.src=url})}
function drawThumbs(){
 $('thumbs').innerHTML=photos.map((d,i)=>`<div class="thumb"><img src="${d}" alt="고른 사진 ${i+1}"><button type="button" data-i="${i}" aria-label="사진 ${i+1} 빼기">×</button></div>`).join('');
 $('pCount').textContent=photos.length?`사진 ${photos.length}장 / 3장`:'';
 $('pickBtn').hidden=photos.length>=MAXP;
}
$('fPhoto').addEventListener('change',async e=>{
 const files=[...e.target.files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic|webp)$/i.test(f.name));
 e.target.value='';
 const room=MAXP-photos.length;
 if(files.length>room)toast(`사진은 3장까지만 넣을 수 있어요`);
 for(const f of files.slice(0,room)){try{photos.push(await shrink(f))}catch(err){toast('이 사진은 넣을 수 없어요')}}
 drawThumbs();
});
$('thumbs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){photos.splice(+b.dataset.i,1);drawThumbs()}});

$('wForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const village=$('fVill').value.trim(),name=$('fName').value.trim(),body=$('fBody').value.trim();
 if(!village){$('wErr').textContent='마을 이름을 적어 주세요';$('fVill').focus();return}
 if(!name){$('wErr').textContent='보내는 분 이름을 적어 주세요';$('fName').focus();return}
 if(!body){$('wErr').textContent='사연과 신청곡을 적어 주세요';$('fBody').focus();return}
 const pin=$('fPin').value.trim();
 if(!/^\d{4}$/.test(pin)){$('wErr').textContent='글 비밀번호를 숫자 4자리로 적어 주세요';$('fPin').focus();return}
 const btn=$('wSubmit');btn.disabled=true;btn.textContent=photos.length?'사진 올리는 중… 잠시만요':'올리는 중…';
 try{
  posts=await server('addPost',{village,name,body,pin,photos:photos.map(d=>({data:d.split(',')[1]}))});
  try{localStorage.setItem('sr_vill',village);localStorage.setItem('sr_name',name)}catch(e){}
  $('fBody').value='';$('fPin').value='';photos=[];drawThumbs();page=1;q='';$('sInput').value='';render();show('vList');toast('신청곡이 올라갔습니다. 감사합니다!');if(adminPin)load(true);
 }catch(err){$('wErr').textContent='올리지 못했습니다. 잠시 뒤 다시 눌러 주세요'}
 finally{btn.disabled=false;btn.textContent='올리기'}
});

// ---- 홈 화면 앱
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let seen=false;try{seen=localStorage.getItem('sr_inst_x')==='1'}catch(e){}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone&&!seen&&matchMedia('(pointer:coarse)').matches){$('instBtn').hidden=false;$('inst').hidden=false}});
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(ios&&!standalone&&!seen){$('instTxt').innerHTML="앱으로 쓰려면 화면 아래 <b>공유 버튼</b>(네모에 위쪽 화살표)을 누르고 <b>'홈 화면에 추가'</b>를 누르세요";$('instBtn').hidden=true;$('inst').hidden=false}
$('instBtn').addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();const r=await deferred.userChoice;deferred=null;$('inst').hidden=true;if(r&&r.outcome==='accepted')toast('홈 화면에 라디오 서천 앱이 생겼어요')});
$('instX').addEventListener('click',()=>{$('inst').hidden=true;try{localStorage.setItem('sr_inst_x','1')}catch(e){}});
window.addEventListener('appinstalled',()=>{$('inst').hidden=true});

render();load();
// 다른 사람이 올린 글도 30초마다 저절로 보이게
setInterval(()=>{if(!document.hidden&&!$('vList').hidden)load(true)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});
}
</script>
</body>
</html>
